[package]
name = "libgit2-rs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "libgit2's core (objects, odb, refs, config, index, repository, util) ported to Rust, serving libgit2's C ABI and a safe Rust API"

[lib]
name = "libgit2_rs"
crate-type = ["rlib", "staticlib"]

[dependencies]
ffibox = { path = "/work/ffibox" }
libc = "0.2"
memchr = "2"
# hash: SHA-1 with collision detection (sha1dc, ported to Rust).
sha1collisiondetection = { version = "0.3.4", default-features = false }
# zstream: zlib-rs, a Rust zlib, for inflating (see util/zstream.rs).
libz-rs-sys = { version = "0.6.8", default-features = false, features = ["std", "rust-allocator"] }

[dev-dependencies]
# A reference SHA-256 for the tests of util/hash/sha256.rs.
sha2 = "0.11"

[lints]
workspace = true

[features]
# Link the rest of libgit2's C (see build.rs). Needed by `cargo test` outside
# Miri, and by Rust consumers of the safe API.
link-c = []
