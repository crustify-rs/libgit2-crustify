[package]
name = "execute-export-moves-an-empty-runs-error-pos"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
libgit2 = { package = "libgit2-crustify", path = "../../../../../../../../../../..", features = [
  "ffi-export-deps-llhttp-api-c",
] }

[patch."https://github.com/crustify-rs/glibc-crustify"]
glibc-bindings = { path = "/target/glibc-crustify" }

[patch."https://github.com/crustify-rs/ffibox"]
ffibox = { path = "/crustify-rs/ffibox" }
